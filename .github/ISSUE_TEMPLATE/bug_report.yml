---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the following information to help us locate the issue quickly.
  - type: input
    id: version
    attributes:
      label: Package Version
      description: Run `pnpm list @youzi9601/typed-event-bus` or check package.json
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime Environment
      description: Node.js / Bun / Deno / Browser / Electron etc.
      placeholder: "Node.js 22 LTS"
    validations:
      required: true
  - type: input
    id: typescript
    attributes:
      label: TypeScript Version
      placeholder: "7.0.2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Briefly and clearly describe what happened and what you expected
      placeholder: |
        When calling `bus.onAll(userEvents, ...)`, TypeScript fails to correctly narrow the payload type...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps / Minimal Repro
      description: Provide a runnable minimal code snippet, or a GitHub repo link
      render: typescript
      placeholder: |
        import { defineEvent, defineEvents, createEventBus } from '@youzi9601/typed-event-bus'

        const userEvents = defineEvents("user", {
          created: defineEvent("created").payload<{ id: string }>(),
        })

        const bus = createEventBus(userEvents)

        bus.onAll(userEvents, ({ event, payload }) => {
          if (event === "user.created") {
            payload.id  // Expected: string, Actual: unknown
          }
        })
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: 'payload should be correctly inferred as { id: string }'
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: 'payload is unknown or type error'
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Issues and confirmed this is not a duplicate
          required: true
        - label: I have tried the latest version and confirmed the issue still exists
          required: true
        - label: I have provided a minimal reproduction
          required: true