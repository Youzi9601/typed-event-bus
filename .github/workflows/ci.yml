name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Type tests
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Check coverage
        run: pnpm exec vitest run --coverage --reporter=text --reporter=lcov

      - name: Build
        run: pnpm build

      - name: Verify bundle size
        run: node scripts/check-budget.js